apiVersion: v1
kind: Pod
metadata:
    name: oom-test
    annotations:
        fixora.io/repo-url: "https://github.com/baka126/fixora-demo.git"
        fixora.io/repo-path: "pod.yaml"
        fixora.io/vcs-type: "github"
spec:
    restartPolicy: Never
    containers:
        - name: stress
          image: polinux/stress
          resources:
            limits:
                memory: "100Mi"
          args: ["stress", "--vm", "1", "--vm-bytes", "500M", "--vm-hang", "1"]
          apiVersion: v1
          kind: Pod
          metadata:
            annotations:
                fixora.io/repo-path: pod.yaml
                fixora.io/repo-url: https://github.com/baka126/fixora-demo.git
                fixora.io/vcs-type: github
            name: oom-test
          spec:
            nodeSelector:
                kubernetes.io/arch: amd64
            containers:
                - args:
                    - stress
                    - --vm
                    - "1"
                    - --vm-bytes
                    - 500M
                    - --vm-hang
                    - "1"
                  image: polinux/stress
                  name: stress
                  resources:
                    limits:
                        memory: 100Mi
            restartPolicy: Never
