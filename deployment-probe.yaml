apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-probe-correction
  namespace: default
  annotations:
    fixora.io/repo-url: "https://github.com/baka126/fixora-demo.git"
    fixora.io/repo-path: "deployment-probe.yaml"
    fixora.io/vcs-type: "github"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-demo
  template:
    metadata:
      labels:
        app: probe-demo
    spec:
      containers:
      - name: web-app
        image: python:3.9-slim
        # App listens on 8080 but probe is on 80
        command: ["python", "-m", "http.server", "8080"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
